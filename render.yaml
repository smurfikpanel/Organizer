services:
  - type: web
    name: notion-assistant-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.webhook_app"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_EXPENSES_DB_ID
        sync: false
      - key: NOTION_TASKS_DB_ID
        sync: false
      - key: NOTION_REMINDERS_DB_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_CURRENCY
        value: USD
